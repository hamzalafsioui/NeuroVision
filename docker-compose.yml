services:

  # FastAPI - serves classification and detection endpoints
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - .:/app
      - ./models:/app/models
    environment:
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      - KERAS_HOME=/app/.keras
      - TF_ENABLE_ONEDNN_OPTS=0
    depends_on:
      - mlflow
    networks:
      - neurovision_network
    restart: unless-stopped

  # Streamlit - user interface
  streamlit:
    build:
      context: .
      dockerfile: docker/streamlit/Dockerfile
    command: streamlit run streamlit_app/app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    volumes:
      - .:/app
    environment:
      - API_URL=${API_URL:-http://api:8000}
    depends_on:
      - api
    networks:
      - neurovision_network
    restart: unless-stopped

  # MLflow - experiment tracking
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    command: >
      mlflow server
        --backend-store-uri postgresql+psycopg2://${POSTGRES_USER:-neurovision}:${POSTGRES_PASSWORD:-neurovision}@postgres:5432/${POSTGRES_DB:-neurovision}
        --serve-artifacts
        --artifacts-destination /mlflow/artifacts
        --host 0.0.0.0
        --port 5000
        --app-name basic-auth
        --allowed-hosts "*.trycloudflare.com,localhost:5000,127.0.0.1:5000"
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      MLFLOW_AUTH_CONFIG_PATH: /etc/mlflow/basic_auth.ini
      MLFLOW_FLASK_SERVER_SECRET_KEY: ${MLFLOW_SECRET_KEY}
      MLFLOW_AUTH_ADMIN_PASSWORD: ${MLFLOW_ADMIN_PASSWORD}
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
      - mlflow_auth:/mlflow/auth
      - ./docker/mlflow/basic_auth.ini:/etc/mlflow/basic_auth.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - neurovision_network
    restart: unless-stopped

  # PostgreSQL - MLflow and Airflow backend store
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-neurovision}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-neurovision}
      - POSTGRES_DB=${POSTGRES_DB:-neurovision}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neurovision} -d ${POSTGRES_DB:-neurovision}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - neurovision_network
    restart: unless-stopped

  # Apache Airflow - pipeline orchestration
  airflow:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    command: >
      bash -c "airflow db migrate &&
               airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@neurovision.local &&
               airflow webserver"
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - .:/app
    environment:
      - AIRFLOW__CORE__EXECUTOR=${AIRFLOW__CORE__EXECUTOR:-LocalExecutor}
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-neurovision}:${POSTGRES_PASSWORD:-neurovision}@postgres:5432/${POSTGRES_DB:-neurovision}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW__CORE__FERNET_KEY}
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW__WEBSERVER__SECRET_KEY}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://mlflow:5000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - neurovision_network
    restart: unless-stopped

networks:
  neurovision_network:
    driver: bridge

volumes:
  postgres_data:
  mlflow_artifacts:
  mlflow_auth:
